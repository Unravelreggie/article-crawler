name: Build CRDC images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --python 3.12 --extra test --locked
          uv run --python 3.12 --extra test pytest -q

  application:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            build_args: ""
          - name: web
            context: ./frontend
            build_args: NGINX_CONF=nginx.crdc.conf
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.name }}
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ghcr.io/unravelreggie/article-crawler-${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Unravelreggie/article-crawler
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record digest
        run: echo "${{ matrix.name }}=${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            base: postgres:17-alpine
          - name: redis
            base: redis:7-alpine
          - name: rustfs
            base: rustfs/rustfs:1.0.0
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror ${{ matrix.name }}
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/mirror.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: BASE_IMAGE=${{ matrix.base }}
          tags: ghcr.io/unravelreggie/article-crawler-${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Unravelreggie/article-crawler
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record digest
        run: echo "${{ matrix.name }}=${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
