[project]
name = "article-crawler"
version = "0.1.0"
description = "Medical literature search and reference acquisition"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "pymupdf>=1.26,<2",
  "celery[redis]>=5.5,<6",
  "boto3>=1.39,<2",
]
[project.optional-dependencies]
test = ["pytest>=8.4,<9"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
