upstream authentik_outpost {
  zone authentik_outpost 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server authentik-server-1:9000 resolve;
}

upstream article_api {
  zone article_api 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server api:8000 resolve;
}

server {
  listen 80;
  server_name _;
  absolute_redirect off;
  client_max_body_size 26m;
  proxy_buffers 8 16k;
  proxy_buffer_size 32k;

  auth_request /outpost.goauthentik.io/auth/nginx;
  error_page 401 = @goauthentik_proxy_signin;
  auth_request_set $auth_cookie $upstream_http_set_cookie;
  add_header Set-Cookie $auth_cookie;
  auth_request_set $authentik_email $upstream_http_x_authentik_email;
  auth_request_set $authentik_username $upstream_http_x_authentik_username;

  location = /healthz {
    auth_request off;
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /outpost.goauthentik.io {
    auth_request off;
    proxy_pass http://authentik_outpost/outpost.goauthentik.io;
    proxy_set_header Host $http_host;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
  }

  location /api/ {
    proxy_pass http://article_api;
    proxy_read_timeout 120s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Authentik-Email $authentik_email;
    proxy_set_header X-Authentik-Username $authentik_username;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
